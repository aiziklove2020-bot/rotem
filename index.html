<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> רותם בר art&Candle </title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sea-deep: #2C5E5E;
            --sea-medium: #5A8585;
            --sea-light: #B8D4D4;
            --sand-warm: #F5EBE0;
            --off-white: #FFFDFB;
            --text-dark: #1A3A3A;
            --accent-gold: #C5A059;
            --whatsapp-green: #25D366;
            --border-radius-full: 50px;
            --border-radius-card: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--off-white);
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; letter-spacing: 1px; }

        nav {
            position: fixed;
            top: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1400px;
            padding: 0.8rem 3rem;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
            background: rgba(255, 253, 251, 0.8);
            border: 1px solid rgba(245, 235, 224, 0.5);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius-full);
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        .logo { font-size: 1.8rem; font-weight: 700; color: var(--sea-deep); text-decoration: none; }
        .nav-links { display: flex; gap: 3rem; align-items: center; }
        .nav-links a { color: var(--text-dark); text-decoration: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: var(--sea-deep); }

        /* כפתור המבורגר - מוסתר כברירת מחדל */
        .mobile-toggle { display: none; font-size: 1.8rem; cursor: pointer; color: var(--sea-deep); }

        /* --- תמונת הים (ה-Hero) --- */
        .hero {
            height: 90vh;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1603006373364-068c44ecfe0f?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero h1 { font-size: 5rem; margin-bottom: 1rem; text-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .hero p { font-size: 1.5rem; letter-spacing: 5px; text-transform: uppercase; opacity: 0.9; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
            padding: 60px 5%;
        }

        .product-card {
            background: white;
            border-radius: var(--border-radius-card);
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0,0,0,0.05);
            transition: 0.4s ease;
            position: relative;
        }

        .product-card img { width: 100%; height: 400px; object-fit: cover; }

        /* --- התאמות לנייד בלבד --- */
        @media (max-width: 768px) {
            .mobile-toggle { display: block; }
            nav { padding: 0.8rem 1.5rem; top: 15px; }
            .nav-links {
                position: fixed; top: 0; right: -100%; width: 80%; height: 100vh;
                background: var(--off-white); flex-direction: column; justify-content: center;
                transition: 0.4s; z-index: 1001; box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            }
            .nav-links.active { right: 0; }
            .hero h1 { font-size: 2.8rem; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px 10px; }
            .product-card img { height: 200px; }
            .cart-sidebar { width: 100%; }
        }

        /* שאר ה-CSS המקורי שלך (עגלה, מודל וכו') */
        .cart-sidebar { position: fixed; top: 0; right: -450px; width: 420px; height: 100%; background: white; z-index: 2000; transition: 0.5s; padding: 40px; }
        .cart-sidebar.open { right: 0; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">ROTEM BAR</a>
        <div class="mobile-toggle" onclick="toggleMenu()">☰</div>
        <div class="nav-links" id="navLinks">
            <a onclick="scrollToSection('home'); toggleMenu()">בית</a>
            <a onclick="scrollToSection('shop'); toggleMenu()">חנות</a>
            <a onclick="toggleCart(); toggleMenu()">סל קניות (<span id="cart-count">0</span>)</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1 id="site-hero-title">ROTEM BAR</h1>
        <p id="site-hero-desc">Art & Handmade Candles</p>
    </section>

    <div id="shop">
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <h2>הסל שלי</h2>
        <div id="cart-items" style="margin-top: 20px;"></div>
        <button onclick="toggleCart()" style="margin-top: 20px; width: 100%; padding: 10px; background: var(--sea-deep); color: white; border: none; border-radius: 20px; cursor: pointer;">סגור</button>
    </div>

    <script>
        // פונקציות תפריט
        function toggleMenu() {
            if (window.innerWidth <= 768) {
                document.getElementById('navLinks').classList.toggle('active');
            }
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        // --- פונקציית הטעינה המקורית שלך (לא נגעתי) ---
        function renderAll() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const grid = document.getElementById('productsGrid');
            if(!grid) return;
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}">
                    <div style="padding: 20px; text-align: center;">
                        <h3>${p.name}</h3>
                        <p>₪${p.price}</p>
                        <button onclick="addToCart(${p.id})" style="background: var(--sea-deep); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin-top: 10px; width: 100%;">הוסף לסל</button>
                    </div>
                </div>
            `).join('');

            const content = JSON.parse(localStorage.getItem('siteContent'));
            if(content) {
                if(content.title) document.getElementById('site-hero-title').innerText = content.title;
                if(content.desc) document.getElementById('site-hero-desc').innerText = content.desc;
            }
        }

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function addToCart(id) {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const p = products.find(prod => prod.id === id);
            const inCart = cart.find(item => item.id === id);
            if(inCart) inCart.qty++; else cart.push({...p, qty: 1});
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            const count = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-items').innerHTML = cart.map(item => `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span>${item.name} (x${item.qty})</span>
                    <span>₪${item.price * item.qty}</span>
                </div>
            `).join('');
        }

        window.onload = () => {
            renderAll();
            updateCartUI();
        };
    </script>
</body>
</html>
