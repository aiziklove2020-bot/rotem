<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>רותם בר | art&Candle</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sea-deep: #2C5E5E; --sea-medium: #5A8585; --sea-light: #B8D4D4;
            --sand-warm: #F5EBE0; --off-white: #FFFDFB; --text-dark: #1A3A3A;
            --accent-gold: #C5A059; --whatsapp-green: #25D366;
            --border-radius-full: 50px; --border-radius-card: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Assistant', sans-serif; background-color: var(--off-white); color: var(--text-dark); overflow-x: hidden; line-height: 1.6; }

        nav { position: fixed; top: 0; width: 100%; background: rgba(255, 253, 251, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; z-index: 1000; box-shadow: 0 2px 20px rgba(0,0,0,0.05); }
        .logo { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 700; color: var(--sea-deep); text-decoration: none; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 600; transition: 0.3s; }
        .mobile-menu-btn { display: none; font-size: 1.8rem; cursor: pointer; color: var(--sea-deep); }

        .hero { height: 70vh; background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1603006373364-068c44ecfe0f?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; margin-top: 60px; text-align: center; }
        .hero h1 { font-family: 'Cinzel', serif; font-size: 4rem; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: white; border-radius: var(--border-radius-card); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: 0.3s; }
        .product-card img { width: 100%; height: 300px; object-fit: cover; }
        .product-info { padding: 20px; text-align: center; }
        .add-to-cart-btn { background: var(--sea-deep); color: white; border: none; padding: 12px; border-radius: var(--border-radius-full); width: 100%; cursor: pointer; font-weight: 600; }

        .cart-sidebar { position: fixed; top: 0; right: -450px; width: 400px; height: 100%; background: white; z-index: 2000; transition: 0.4s; padding: 30px; box-shadow: -5px 0 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .cart-sidebar.open { right: 0; }

        @media (max-width: 768px) {
            nav { padding: 10px 20px; }
            .mobile-menu-btn { display: block; }
            .nav-links { position: fixed; top: 60px; right: -100%; width: 100%; height: auto; background: var(--off-white); flex-direction: column; padding: 30px; transition: 0.4s; box-shadow: 0 10px 10px rgba(0,0,0,0.05); }
            .nav-links.active { right: 0; }
            .hero h1 { font-size: 2.5rem; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .product-card img { height: 180px; }
            .cart-sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" class="logo">ROTEM BAR</a>
        <div class="mobile-menu-btn" onclick="toggleMenu()">☰</div>
        <div class="nav-links">
            <a href="#home" onclick="toggleMenu()">בית</a>
            <a href="#shop" onclick="toggleMenu()">חנות</a>
            <a href="javascript:void(0)" onclick="toggleCart(); toggleMenu()">סל קניות (<span id="cart-count">0</span>)</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1>ROTEM BAR</h1>
        <p>Art & Handmade Candles</p>
    </section>

    <div class="container" id="shop">
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <h2>הסל שלי</h2>
        <div id="cart-items" style="flex-grow:1; overflow-y:auto; margin: 20px 0;"></div>
        <button class="add-to-cart-btn" onclick="toggleCart()">סגור</button>
    </div>

    <script>
        function toggleMenu() { document.querySelector('.nav-links').classList.toggle('active'); }
        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('open'); }
        
        function render() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            document.getElementById('productsGrid').innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image || 'https://via.placeholder.com/300'}">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>₪${p.price}</p>
                        <button class="add-to-cart-btn">הוסף לסל</button>
                    </div>
                </div>
            `).join('');
        }
        window.onload = render;
    </script>
</body>
</html>
