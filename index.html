<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> רותם בר art&Candle </title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sea-deep: #2C5E5E;
            --sea-medium: #5A8585;
            --sea-light: #B8D4D4;
            --sand-warm: #F5EBE0;
            --off-white: #FFFDFB;
            --text-dark: #1A3A3A;
            --accent-gold: #C5A059;
            --whatsapp-green: #25D366;
            --border-radius-full: 50px;
            --border-radius-card: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--off-white);
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; letter-spacing: 1px; }

        nav {
            position: fixed;
            top: 20px; left: 5%; right: 5%;
            width: 90%;
            padding: 0.6rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(255, 253, 251, 0.95);
            border: 1px solid var(--sand-warm);
            backdrop-filter: blur(15px);
            border-radius: var(--border-radius-full);
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--sea-deep);
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 2rem; align-items: center; }

        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active { color: var(--accent-gold); }

        /* כפתור המבורגר - מוסתר במחשב */
        .mobile-menu-btn {
            display: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--sea-deep);
        }

        /* --- התאמות למובייל בלבד --- */
        @media (max-width: 768px) {
            nav {
                padding: 0.6rem 1.5rem;
                top: 10px;
            }
            
            .mobile-menu-btn {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 70%;
                height: 100vh;
                background: var(--off-white);
                flex-direction: column;
                justify-content: center;
                gap: 2rem;
                transition: 0.4s ease-in-out;
                box-shadow: -10px 0 30px rgba(0,0,0,0.1);
                z-index: 1001;
                border-radius: 30px 0 0 30px;
            }

            .nav-links.active {
                right: 0;
            }

            /* שינוי גריד המוצרים ל-2 בשורה שיראה טוב בנייד */
            .products-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
                padding: 10px !important;
            }

            .product-card img {
                height: 180px !important;
            }

            .hero h1 {
                font-size: 2.2rem !important;
            }
            
            .cart-sidebar {
                width: 100% !important;
            }
        }

        /* שאר ה-CSS המקורי שלך (Hero, Products וכו') נשמר כאן במלואו */
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1603006373364-068c44ecfe0f?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px 5%;
        }

        .product-card {
            background: white;
            border-radius: var(--border-radius-card);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .product-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .product-info { padding: 20px; text-align: center; }

        .add-to-cart-btn {
            background: var(--sea-deep);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: var(--border-radius-full);
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }

        /* עגלת קניות */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -450px;
            width: 400px;
            height: 100%;
            background: white;
            z-index: 2000;
            transition: 0.4s;
            padding: 30px;
            box-shadow: -5px 0 30px rgba(0,0,0,0.1);
        }
        .cart-sidebar.open { right: 0; }

    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">ROTEM BAR</a>
        <div class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</div>
        <div class="nav-links" id="navLinks">
            <a onclick="toggleMobileMenu()">בית</a>
            <a href="#shop" onclick="toggleMobileMenu()">חנות</a>
            <a href="javascript:void(0)" onclick="toggleCart(); toggleMobileMenu()">סל קניות (<span id="cart-count">0</span>)</a>
        </div>
    </nav>

    <section class="hero">
        <h1>ROTEM BAR</h1>
        <p>Art & Handmade Candles</p>
    </section>

    <div id="shop">
        <div class="products-grid" id="productsGrid">
            </div>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <h2>הסל שלי</h2>
        <div id="cart-items"></div>
        <button class="add-to-cart-btn" onclick="toggleCart()">סגור</button>
    </div>

    <script>
        // פונקציה לפתיחת תפריט המבורגר
        function toggleMobileMenu() {
            if (window.innerWidth <= 768) {
                document.getElementById('navLinks').classList.toggle('active');
            }
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        // פונקציית הטעינה המקורית שלך - לא נגעתי ב-ID או בשמות
        function renderAll() {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>₪${p.price}</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">הוסף לסל</button>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => {
            renderAll();
            // כאן יבואו שאר הפונקציות המקוריות שלך (עדכון מונה עגלה וכו')
        };
    </script>
</body>
</html>
